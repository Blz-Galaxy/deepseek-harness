name: Build ARM64 Offline Bundle

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04-arm # 关键：使用 GitHub 的 ARM64 原生 runner
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup pnpm & Node.js
        uses: pnpm/action-setup@v5
              
      - uses: actions/setup-node@v5
        with:
          node-version: '24' # 或 22，满足 dsh 要求
          cache: 'pnpm'

      - name: Install dependencies (with lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build dsh
        run: pnpm run build

      - name: Prepare offline archive
        run: |
          # 将构建产物和完整的 node_modules 一起打包
          tar -czf /tmp/dsh-web-arm64-offline.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            . 
          # 注意：这里打包的是整个仓库根目录，包含了 node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dsh-web-arm64-offline
          path: /tmp/dsh-web-arm64-offline.tar.gz

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: dsh-web-arm64-offline-${{ github.run_number }}
          files: /tmp/dsh-web-arm64-offline.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
