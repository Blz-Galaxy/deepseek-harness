name: Build ARM64 Offline Bundle (npm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install DSH in isolated directory
        run: |
          # 关键：在 /tmp 下建独立目录，与仓库完全隔离
          mkdir -p /tmp/dsh-bundle
          cd /tmp/dsh-bundle
          npm init -y
          npm install @deepseek-ai/dsh

      - name: Verify installation
        run: |
          cd /tmp/dsh-bundle
          node --version
          ./node_modules/.bin/dsh --version

      - name: Package offline bundle
        run: |
          cd /tmp/dsh-bundle
          tar -czhf /tmp/dsh-web-arm64-offline.tar.gz \
            --warning=no-file-changed \
            package.json \
            package-lock.json \
            node_modules

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dsh-web-arm64-offline
          path: /tmp/dsh-web-arm64-offline.tar.gz
          retention-days: 30

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: offline-${{ github.run_number }}
          name: DSH ARM64 Offline Bundle #${{ github.run_number }}
          files: /tmp/dsh-web-arm64-offline.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
